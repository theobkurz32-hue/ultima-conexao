name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:story
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: base
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          owner_name="${GITHUB_REPOSITORY%%/*}"
          if [[ "${repository_name,,}" == "${owner_name,,}.github.io" ]]; then
            echo 'path=/' >> "$GITHUB_OUTPUT"
          else
            echo "path=/${repository_name}/" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
      - run: npm run verify:build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
